<!DOCTYPE html>
<html lang="{{ page.lang | default: 'fr' }}">
<head>
  {% include head.html %}
</head>
<body class="page-{{ page.ref | default: 'error' }}">
  {% assign t = site.data.translations[page.lang] %}
  <a class="skip-link" href="#main-content">{{ t.skip_link }}</a>
  {% include header.html %}
  <main id="main-content" tabindex="-1">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ site.baseurl }}/assets/js/site.js"></script>
  <!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-aI8zAp6oCsVcG8Iq2ZBUP.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
</body>
</html>
