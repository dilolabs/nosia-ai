<header class="header">
  <div class="container">
    {% assign t = site.data.translations[page.lang] %}
    <a href="{{ site.baseurl }}/" class="logo" aria-label="{{ t.home }}">
      <img src="{{ site.baseurl }}/assets/images/nosia-logo.png" alt="{{ t.logo_alt }}" height="48">
    </a>
    <nav class="nav" aria-label="{{ t.nav_aria }}">
      <a href="#documentation">{{ t.documentation }}</a>
      <a href="#community">{{ t.community }}</a>
      <a href="https://github.com/nosia-ai/nosia" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="#" class="lang-toggle" data-lang-toggle aria-label="{{ t.toggle_lang }}">English</a>
    </nav>
  </div>
</header>
