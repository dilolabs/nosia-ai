en:
  discover: "See how it works"
  by: "Developed by"
  preview_label: "This is Nosia"
  preview_type: "Mac app · v0.6.1"
  preview_caption: "A question, your documents, your workspace."
  capture_note: "Actual frame from the Mac v0.6.1 tutorial, French interface."
  capture_alt: "Nosia app: new conversation, question field, PDF attachment and account selection."
  workspace_alt: "Nosia workspace: new conversation and Import knowledge sources button."
  product_eyebrow: "02 — The product in practice"
  product_title: "A place to ask questions. And move forward."
  product_intro: "A conversation to think things through, your documents to add context. The interface stays focused on what you want to do."
  full_capture: "Open the full-size screenshot"
  annotations:
    - { title: "Ask your question", text: "Use your own words to explore an idea or prepare a piece of writing." }
    - { title: "Add your documents", text: "Attach a PDF or import knowledge sources into your account." }
    - { title: "Choose your workspace", text: "The selected account determines which sources are used in the conversation." }
  uses_eyebrow: "01 — Start with your needs"
  examples: "Illustrative example questions, not customer testimonials."
  how_eyebrow: "03 — How it works"
  how_title: "Your knowledge. A model. The right connections."
  how_intro: "Choose the building blocks you need. You don’t have to connect everything to get started."
  how:
    - { icon: "document", title: "Your documents", text: "Import useful content. Document search adds context to your questions." }
    - { icon: "spark", title: "Your models", text: "A local configuration on Mac, or models configured for your instance." }
    - { icon: "plug", title: "Your tools", text: "Connect compatible services, with their permissions, when your use case calls for it." }
    - { icon: "deploy", title: "Your deployment", text: "On a compatible Mac or on infrastructure administered by your team." }
  technical: "What about the technical details?"
  technical_text: "RAG (Retrieval Augmented Generation) enriches answers with passages found in your documents. MCP (Model Context Protocol) links AI to tools and external sources. The OpenAI-compatible application programming interface (API) lets you connect existing clients; compatibility depends on the functions and models you use."
  technical_link: "Read the architecture and guides"
  install_eyebrow: "04 — Get started with Nosia"
  cli_requirements: "Linux: Debian or Ubuntu, internet access and administrator privileges if Docker needs installing. Windows 10/11 64-bit: Docker Desktop installed and running. Memory and storage needs depend on your models."
  cli_caution: "These commands download and execute a script. Read it before running it. After installation, start the services using the full guide, which also explains local HTTPS configuration."
  cli_guide: "Read the full instructions and scripts"
  team_install: "For a team or a server"
  team_install_text: "Docker Compose deployment is documented. Plan for model configuration, access permissions, your domain, backups and maintenance."
  team_install_link: "The deployment guide"
  ownership_eyebrow: "05 — Openness and control"
  ownership_title: "The freedom to choose. The means to act."
  ownership:
    - { title: "Open code", text: "Read, use, modify, contribute: Nosia’s source code is available under the MIT license." }
    - { title: "Your choice of hosting", text: "Local use and self-hosting give you control, alongside responsibility for security and maintenance." }
    - { title: "Explicit connections", text: "Where your data is processed depends on the hosting, models and external services you enable." }
  company_eyebrow: "06 — Dilolabs & the community"
  company_title: "An open product. A team by your side."
  company_text: "Nosia is developed by Dilolabs, in Normandy. Cyril, Aude and Melvin are its three co-managers. The company helps organizations with their digital tools and practical AI use cases."
  company_link: "Meet Dilolabs"
  contact: "Let’s talk about your needs"
  history: "How Nosia began"
  final_title: "Your first step: a practical need."
  final_text: "Try Nosia with your documents, explore the code or talk to Dilolabs about a deployment that fits your needs."
  start: "Install Nosia"
